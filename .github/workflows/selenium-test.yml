name: Run Selenium Java Tests

on:
  push:
    branches: [prestaging]
  pull_request:
    branches: [prestaging]

jobs:
  test-suite:
    name: Run Selenium Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      MAVEN_OPTS: "-Xmx2g"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome Installed
        run: google-chrome --version

      - name: Run Tests with Maven
        run: mvn clean test -Dtestng.xml
