name: Run Selenium Java Tests

on:
  push:
    branches: [prestaging]
  pull_request:
    branches: [prestaging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: "-Xmx2g"
      DELETEUSERTOKEN: ${{ secrets.DELETEUSERTOKEN }}
      RESETPASSWORDUSERTOKEN: ${{ secrets.RESETPASSWORDUSERTOKEN }}

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run Tests with Maven
        run: mvn test -Dtest=CreateAccountTest#testSuccessfulAccountCreation -Dtestng.xml -DHEADLESS_MODE=true
